# ----------------------------------------
# Networking Configuration (Optimized)
# ----------------------------------------
CONFIG_WIFI=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_NETMASK=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=768
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=3
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=1

# ----------------------------------------
# MQTT Configuration (Minimal)
# ----------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# ----------------------------------------
# TLS/SSL Configuration (Optimized)
# ----------------------------------------
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=2
CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_BUILTIN=n
CONFIG_MBEDTLS_ENABLE_HEAP=n
# Remove less critical crypto algorithms
CONFIG_MBEDTLS_SHA1=n
CONFIG_MBEDTLS_SHA384=n

# ----------------------------------------
# Blynk OTA: Minimal crypto support
# ----------------------------------------
CONFIG_MBEDTLS_MD5=y
CONFIG_MBEDTLS_CIPHER=y

# ----------------------------------------
# CRC Support (lightweight)
# ----------------------------------------
CONFIG_CRC=y

# ----------------------------------------
# HTTP Client and JSON Support (Minimal)
# ----------------------------------------
CONFIG_HTTP_CLIENT=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_JSON_LIBRARY=y

# ----------------------------------------
# Flash and Image Management (Optimized)
# ----------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
# Reduce logging level
CONFIG_IMG_MANAGER_LOG_LEVEL_WRN=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.1.7"
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_SCRATCH=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ----------------------------------------
# System Settings (Optimized)
# ----------------------------------------
CONFIG_POSIX_API=y
CONFIG_REQUIRES_FULL_LIBC=n
CONFIG_MINIMAL_LIBC=y
CONFIG_INIT_STACKS=n
CONFIG_STACK_CANARIES=n
CONFIG_REBOOT=y

# ----------------------------------------
# Thread and Stack Configuration (Reduced)
# ----------------------------------------
CONFIG_THREAD_NAME=n
CONFIG_THREAD_MONITOR=n
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_NET_RX_STACK_SIZE=256
CONFIG_NET_TX_STACK_SIZE=256
CONFIG_HEAP_MEM_POOL_SIZE=2048

# ----------------------------------------
# Logging Configuration (Disabled for space)
# ----------------------------------------
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_NET_LOG=n
CONFIG_NET_SHELL=n
CONFIG_MQTT_LOG_LEVEL_OFF=y
CONFIG_NET_TCP_LOG_LEVEL_OFF=y
CONFIG_NET_SOCKETS_LOG_LEVEL_OFF=y
CONFIG_NET_DHCPV4_LOG_LEVEL_OFF=y
CONFIG_NET_IF_LOG_LEVEL_OFF=y
CONFIG_SOCKS_LOG_LEVEL_OFF=y
CONFIG_NET_CONFIG_LOG_LEVEL_OFF=y
CONFIG_NET_CONNECTION_MANAGER_LOG_LEVEL_OFF=y
CONFIG_DNS_RESOLVER_LOG_LEVEL_OFF=y
CONFIG_NET_CONTEXT_LOG_LEVEL_OFF=y
CONFIG_MBEDTLS_DEBUG=n

# ----------------------------------------
# Additional Memory Optimizations
# ----------------------------------------
CONFIG_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_MCUBOOT_SHELL=n
CONFIG_FLASH_SHELL=n

# Optimize compiler settings
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os"

# ----------------------------------------
# Blynk OTA: Remove floating point if not needed
# ----------------------------------------
# Only enable if you actually need floating point operations
# CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n
# CONFIG_NEWLIB_LIBC_FLOAT_SCANF=n

# ----------------------------------------
# Blynk Configuration
# ----------------------------------------
CONFIG_CLOUD_BLYNK_TEMPLATE_ID="TMPLxxx"
CONFIG_CLOUD_BLYNK_AUTH_TOKEN="***"
CONFIG_CLOUD_BLYNK_TEMPLATE_NAME="sample"
CONFIG_CLOUD_BLYNK_SERVER_ADDR="blynk.cloud"
CONFIG_CLOUD_BLYNK_SERVER_PORT=8883

